<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELIOS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a843;
            --gold-light: #e8c96a;
            --gold-glow: rgba(212,168,67,0.15);
            --navy: #080d18;
            --navy-card: #101828;
            --navy-light: #182a45;
            --border: #2a3f5c;
            --text: #e8eaf0;
            --dim: #7a8ba8;
            --red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            background: var(--navy);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(212,168,67,0.06) 0%, transparent 60%);
        }
        .login-card {
            background: var(--navy-card);
            border: 1px solid var(--border);
            border-top: 2px solid var(--gold);
            border-radius: 16px;
            padding: 44px 40px;
            width: 400px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 80px rgba(212,168,67,0.04);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 14px;
            filter: drop-shadow(0 4px 12px rgba(212,168,67,0.2));
        }
        .login-logo h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--gold);
            margin: 0;
            letter-spacing: 3px;
        }
        .login-logo p {
            font-size: 0.78rem;
            color: var(--dim);
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .form-control {
            background: var(--navy);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 4px;
        }
        .form-control:focus {
            background: var(--navy);
            border-color: var(--gold);
            color: var(--text);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .form-control::placeholder {
            letter-spacing: normal;
            color: var(--dim);
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #0b1120;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 18px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            box-shadow: 0 4px 20px rgba(212,168,67,0.3);
        }
        .error-msg {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            color: var(--red);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            text-align: center;
            margin-bottom: 16px;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.68rem;
            color: var(--dim);
            opacity: 0.6;
        }
        @media(max-width:480px){
            .login-card{width:92%;padding:28px 20px}
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/static/logo.png" alt="HELIOS">
            <h2>HELIOS</h2>
            <p>SECURITY SOLUTIONS</p>
        </div>

        {% if error %}
        <div class="error-msg">
            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" class="form-control" name="password"
                   placeholder="Password" autofocus autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')this.form.submit()">
            <button type="submit" class="btn-login">
                <i class="bi bi-shield-lock me-1"></i>ACCESS
            </button>
        </form>
        <div class="footer-text">HELIOS OSINT INTELLIGENCE PLATFORM</div>
    </div>
</body>
</html>
