<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Recon - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #7c5cfc;
            --accent-glow: rgba(124,92,252,0.2);
            --bg: #0f0f14;
            --bg-card: #1a1a24;
            --border: #2a2a3a;
            --text: #e2e2e8;
            --dim: #8888a0;
            --red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo i {
            font-size: 2.5rem;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }
        .login-logo h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }
        .login-logo p {
            font-size: 0.82rem;
            color: var(--dim);
            margin-top: 4px;
        }
        .form-control {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 4px;
        }
        .form-control:focus {
            background: var(--bg);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-control::placeholder {
            letter-spacing: normal;
            color: var(--dim);
        }
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 16px;
        }
        .btn-login:hover {
            background: #6b4de6;
        }
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--red);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            text-align: center;
            margin-bottom: 16px;
        }
        .lock-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .lock-icon i {
            font-size: 1.5rem;
            color: var(--accent);
        }
        @media(max-width:480px){
            .login-card{width:92%;padding:28px 20px}
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="lock-icon"><i class="bi bi-shield-lock"></i></div>
            <h2>OSINT Recon</h2>
            <p>비밀번호를 입력하세요</p>
        </div>

        {% if error %}
        <div class="error-msg">
            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" class="form-control" name="password"
                   placeholder="Password" autofocus autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')this.form.submit()">
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i>로그인
            </button>
        </form>
    </div>
</body>
</html>
