<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT 정보수집 도구</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #00d4aa;
            --accent-dim: #00a88550;
            --bg-card: #1a1d23;
            --bg-body: #0d1117;
            --bg-result: #161b22;
        }
        body {
            background: var(--bg-body);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #c9d1d9;
        }
        .navbar {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            border-bottom: 1px solid #30363d;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--accent) !important;
        }
        .navbar-brand i { margin-right: 8px; }
        .module-card {
            background: var(--bg-card);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            height: 100%;
        }
        .module-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 170, 0.15);
        }
        .module-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }
        .module-card .icon-wrap {
            width: 48px; height: 48px;
            border-radius: 10px;
            background: var(--accent-dim);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
        }
        .module-card .icon-wrap i {
            font-size: 1.3rem;
            color: var(--accent);
        }
        .module-card h6 {
            color: #e6edf3;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .module-card p {
            font-size: 0.82rem;
            color: #8b949e;
            margin: 0;
        }
        .scan-section {
            background: var(--bg-card);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
            margin-top: 24px;
        }
        .form-control {
            background: var(--bg-body);
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
        }
        .form-control:focus {
            background: var(--bg-body);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
            color: #e6edf3;
        }
        .btn-scan {
            background: var(--accent);
            color: #0d1117;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-scan:hover {
            background: #00eabb;
            color: #0d1117;
            transform: translateY(-1px);
        }
        .btn-scan:disabled {
            background: #30363d;
            color: #8b949e;
        }
        .result-box {
            background: var(--bg-result);
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-top: 24px;
            overflow: hidden;
        }
        .result-header {
            background: #1c2128;
            padding: 14px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-header h5 {
            margin: 0;
            font-size: 0.95rem;
            color: var(--accent);
        }
        .result-body {
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .result-body::-webkit-scrollbar {
            width: 6px;
        }
        .result-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .result-body::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .data-table td, .data-table th {
            padding: 10px 14px;
            border-bottom: 1px solid #21262d;
            font-size: 0.88rem;
        }
        .data-table th {
            color: var(--accent);
            font-weight: 600;
            width: 180px;
            vertical-align: top;
            white-space: nowrap;
        }
        .data-table td {
            color: #c9d1d9;
            word-break: break-all;
        }
        .badge-open { background: #238636; }
        .badge-closed { background: #da3633; }
        .badge-info { background: #1f6feb; }
        .badge-warn {
            background: #9e6a03;
            color: #f0e68c;
        }
        .spinner-scan {
            display: none;
            color: var(--accent);
        }
        .error-msg {
            color: #f85149;
            background: #f8514915;
            border: 1px solid #f8514930;
            border-radius: 8px;
            padding: 14px 18px;
            margin-top: 16px;
        }
        .status-bar {
            background: #1c2128;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 16px;
            margin-top: 16px;
            font-size: 0.85rem;
            color: #8b949e;
            display: none;
        }
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
            font-size: 0.82rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .target { color: #e6edf3; }
        .history-item .module-tag {
            font-size: 0.72rem;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .history-item .time {
            color: #484f58;
            font-size: 0.75rem;
        }
        .footer {
            text-align: center;
            padding: 30px 0;
            color: #484f58;
            font-size: 0.82rem;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .scanning { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-binoculars"></i>OSINT Recon
        </a>
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="btn btn-sm" style="border:1px solid #30363d; color:#8b949e; font-size:0.82rem;">
                <i class="bi bi-activity me-1"></i>파이프라인
            </a>
            <a href="/chat" class="btn btn-sm" style="border:1px solid #30363d; color:#8b949e; font-size:0.82rem;">
                <i class="bi bi-chat-dots me-1"></i>AI 채팅
            </a>
            <span class="text-muted" style="font-size:0.82rem;">
                <i class="bi bi-clock-history me-1"></i>
                조회: <span id="totalScans">0</span>건
            </span>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- Module Grid -->
    <div class="row g-3" id="moduleGrid">
        {% for key, mod in modules.items() %}
        <div class="col-6 col-md-4 col-lg-3 col-xl-2">
            <div class="module-card" data-module="{{ key }}" data-param="{{ mod.param }}" data-placeholder="{{ mod.placeholder }}" onclick="selectModule(this)">
                <div class="icon-wrap"><i class="bi {{ mod.icon }}"></i></div>
                <h6>{{ mod.label }}</h6>
                <p>{{ mod.desc }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Scan Input -->
    <div class="scan-section" id="scanSection">
        <div class="row align-items-end g-3">
            <div class="col">
                <label class="form-label" id="inputLabel" style="font-size:0.85rem; color:#8b949e;">
                    <i class="bi bi-crosshair me-1"></i>대상 입력
                </label>
                <input type="text" class="form-control" id="targetInput"
                       placeholder="모듈을 선택하세요" disabled
                       onkeydown="if(event.key==='Enter') runScan()">
            </div>
            <div class="col-auto">
                <button class="btn btn-scan" id="scanBtn" onclick="runScan()" disabled>
                    <span id="scanBtnText"><i class="bi bi-play-fill me-1"></i>스캔</span>
                    <span id="scanSpinner" class="spinner-scan">
                        <span class="spinner-border spinner-border-sm me-1"></span>분석 중...
                    </span>
                </button>
            </div>
        </div>
        <div class="status-bar" id="statusBar"></div>
    </div>

    <!-- Results -->
    <div id="resultArea"></div>

    <!-- History -->
    <div class="result-box mt-4" id="historyBox" style="display:none;">
        <div class="result-header">
            <h5><i class="bi bi-clock-history me-2"></i>조회 기록</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="clearHistory()">초기화</button>
        </div>
        <div class="result-body history-list" id="historyList"></div>
    </div>
</div>

<div class="footer">
    OSINT Information Gathering Tool &mdash; 허가된 대상에 대해서만 사용하세요.
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let selectedModule = null;
    let scanCount = 0;
    const history = [];

    function selectModule(el) {
        document.querySelectorAll('.module-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');

        selectedModule = el.dataset.module;
        const param = el.dataset.param;
        const placeholder = el.dataset.placeholder;
        const label = el.querySelector('h6').textContent;

        const input = document.getElementById('targetInput');
        input.disabled = false;
        input.placeholder = placeholder;
        input.focus();

        document.getElementById('inputLabel').innerHTML =
            `<i class="bi bi-crosshair me-1"></i>${label} - ${param} 입력`;
        document.getElementById('scanBtn').disabled = false;
    }

    async function runScan() {
        if (!selectedModule) return;

        const target = document.getElementById('targetInput').value.trim();
        if (!target) {
            document.getElementById('targetInput').classList.add('is-invalid');
            setTimeout(() => document.getElementById('targetInput').classList.remove('is-invalid'), 1500);
            return;
        }

        const btn = document.getElementById('scanBtn');
        const btnText = document.getElementById('scanBtnText');
        const spinner = document.getElementById('scanSpinner');
        const statusBar = document.getElementById('statusBar');

        btn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'inline';
        statusBar.style.display = 'block';
        statusBar.innerHTML = `<i class="bi bi-radar me-1 scanning"></i> <strong>${target}</strong> 분석 중...`;

        try {
            const resp = await fetch('/api/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({module: selectedModule, target: target})
            });
            const data = await resp.json();
            renderResult(data, selectedModule, target);

            scanCount++;
            document.getElementById('totalScans').textContent = scanCount;

            addHistory(selectedModule, target, data.success);
        } catch (e) {
            renderError('네트워크 오류: ' + e.message);
        } finally {
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
            statusBar.style.display = 'none';
        }
    }

    function renderResult(data, moduleName, target) {
        const area = document.getElementById('resultArea');
        const card = document.querySelector(`.module-card[data-module="${moduleName}"]`);
        const label = card ? card.querySelector('h6').textContent : moduleName;

        if (!data.success) {
            area.innerHTML = `<div class="error-msg"><i class="bi bi-exclamation-triangle me-2"></i>${data.error}</div>`;
            return;
        }

        let html = `
            <div class="result-box">
                <div class="result-header">
                    <h5><i class="bi bi-check-circle me-2"></i>${label} 결과 — ${target}</h5>
                    <button class="btn btn-sm btn-outline-secondary" onclick="copyResult()">
                        <i class="bi bi-clipboard me-1"></i>복사
                    </button>
                </div>
                <div class="result-body" id="resultContent">
        `;

        html += renderData(data.data, moduleName);
        html += '</div></div>';
        area.innerHTML = html;
    }

    function renderData(data, moduleName) {
        if (moduleName === 'port_scan') return renderPortScan(data);
        if (moduleName === 'headers') return renderHeaders(data);
        if (moduleName === 'subdomains') return renderSubdomains(data);
        if (moduleName === 'tech') return renderTech(data);
        if (moduleName === 'ssl') return renderSSL(data);
        if (moduleName === 'geoip') return renderGeoIP(data);
        return renderGenericTable(data);
    }

    function renderGenericTable(data, depth = 0) {
        let html = '<table class="data-table">';
        for (const [key, val] of Object.entries(data)) {
            const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            html += '<tr>';
            html += `<th>${label}</th>`;
            if (Array.isArray(val)) {
                html += `<td>${val.map(v =>
                    typeof v === 'object' ? `<pre style="margin:0;color:#c9d1d9;font-size:0.82rem">${JSON.stringify(v, null, 2)}</pre>` : v
                ).join('<br>')}</td>`;
            } else if (typeof val === 'object' && val !== null) {
                html += `<td>${renderGenericTable(val, depth + 1)}</td>`;
            } else {
                html += `<td>${val ?? '<span class="text-muted">N/A</span>'}</td>`;
            }
            html += '</tr>';
        }
        html += '</table>';
        return html;
    }

    function renderPortScan(data) {
        let html = `<div class="mb-3" style="font-size:0.88rem;">
            <span class="text-muted">대상:</span> <strong>${data.target}</strong> (${data.ip})
            &nbsp;|&nbsp; 스캔 포트: ${data.scanned_ports}개
            &nbsp;|&nbsp; <span style="color:var(--accent)">열린 포트: ${data.open_ports.length}개</span>
        </div>`;
        if (data.open_ports.length === 0) {
            html += '<p class="text-muted">열린 포트를 찾지 못했습니다.</p>';
            return html;
        }
        html += '<table class="data-table"><tr><th>포트</th><th>상태</th><th>서비스</th></tr>';
        data.open_ports.forEach(p => {
            html += `<tr>
                <td><strong>${p.port}</strong></td>
                <td><span class="badge badge-open">${p.state}</span></td>
                <td>${p.service}</td>
            </tr>`;
        });
        html += '</table>';
        return html;
    }

    function renderHeaders(data) {
        let html = `<div class="mb-3" style="font-size:0.88rem;">
            <span class="text-muted">URL:</span> ${data.url}
            &nbsp;|&nbsp; 상태: <span class="badge badge-info">${data.status_code}</span>
            &nbsp;|&nbsp; 서버: ${data.server}
        </div>`;

        if (data.missing_security_headers && data.missing_security_headers.length > 0) {
            html += '<div class="mb-3"><strong style="color:#d29922"><i class="bi bi-exclamation-triangle me-1"></i>누락된 보안 헤더:</strong><br>';
            data.missing_security_headers.forEach(h => {
                html += `<span class="badge badge-warn me-1 mt-1">${h}</span>`;
            });
            html += '</div>';
        }

        if (data.security_headers && Object.keys(data.security_headers).length > 0) {
            html += '<table class="data-table"><tr><th colspan="2" style="color:#3fb950">✓ 적용된 보안 헤더</th></tr>';
            for (const [k, v] of Object.entries(data.security_headers)) {
                html += `<tr><th>${k}</th><td style="font-size:0.8rem">${v}</td></tr>`;
            }
            html += '</table>';
        }

        html += '<details class="mt-3"><summary style="cursor:pointer;color:#8b949e;font-size:0.85rem">전체 헤더 보기</summary>';
        html += '<table class="data-table mt-2">';
        for (const [k, v] of Object.entries(data.headers)) {
            html += `<tr><th>${k}</th><td style="font-size:0.8rem">${v}</td></tr>`;
        }
        html += '</table></details>';
        return html;
    }

    function renderSubdomains(data) {
        let html = `<div class="mb-3" style="font-size:0.88rem;">
            <span class="text-muted">도메인:</span> <strong>${data.domain}</strong>
            &nbsp;|&nbsp; 검사: ${data.checked}개
            &nbsp;|&nbsp; <span style="color:var(--accent)">발견: ${data.found}개</span>
        </div>`;
        if (data.subdomains.length === 0) {
            html += '<p class="text-muted">서브도메인을 찾지 못했습니다.</p>';
            return html;
        }
        html += '<table class="data-table"><tr><th>서브도메인</th><th>IP 주소</th></tr>';
        data.subdomains.forEach(s => {
            html += `<tr><td><strong>${s.subdomain}</strong></td><td>${s.ips.join(', ')}</td></tr>`;
        });
        html += '</table>';
        return html;
    }

    function renderTech(data) {
        let html = `<div class="mb-3" style="font-size:0.88rem;">
            <span class="text-muted">URL:</span> ${data.url}
            &nbsp;|&nbsp; <span style="color:var(--accent)">탐지된 기술: ${data.count}개</span>
        </div>`;
        if (data.technologies.length === 0) {
            html += '<p class="text-muted">탐지된 기술이 없습니다.</p>';
            return html;
        }
        html += '<table class="data-table"><tr><th>기술</th><th>탐지 출처</th><th>상세</th></tr>';
        data.technologies.forEach(t => {
            html += `<tr>
                <td><strong>${t.name}</strong></td>
                <td><span class="badge badge-info">${t.source}</span></td>
                <td>${t.detail || '-'}</td>
            </tr>`;
        });
        html += '</table>';
        return html;
    }

    function renderSSL(data) {
        let html = '<table class="data-table">';
        const fields = [
            ['프로토콜', data.protocol],
            ['주체 (CN)', data.subject?.commonName],
            ['조직', data.subject?.organizationName],
            ['발급자', data.issuer?.commonName],
            ['발급 조직', data.issuer?.organizationName],
            ['유효 시작', data.not_before],
            ['유효 만료', data.not_after],
            ['버전', data.version],
            ['시리얼 번호', data.serial_number],
        ];
        fields.forEach(([label, val]) => {
            html += `<tr><th>${label}</th><td>${val || 'N/A'}</td></tr>`;
        });
        if (data.subject_alt_names && data.subject_alt_names.length > 0) {
            html += `<tr><th>SAN 목록</th><td>${data.subject_alt_names.join('<br>')}</td></tr>`;
        }
        html += '</table>';
        return html;
    }

    function renderGeoIP(data) {
        let html = '<table class="data-table">';
        const fields = [
            ['IP', data.query],
            ['국가', `${data.country} (${data.countryCode})`],
            ['지역', `${data.regionName} (${data.region})`],
            ['도시', data.city],
            ['우편번호', data.zip],
            ['위도/경도', `${data.lat}, ${data.lon}`],
            ['타임존', data.timezone],
            ['ISP', data.isp],
            ['조직', data.org],
            ['AS', data.as],
        ];
        fields.forEach(([label, val]) => {
            html += `<tr><th>${label}</th><td>${val || 'N/A'}</td></tr>`;
        });
        html += '</table>';
        return html;
    }

    function renderError(msg) {
        document.getElementById('resultArea').innerHTML =
            `<div class="error-msg"><i class="bi bi-exclamation-triangle me-2"></i>${msg}</div>`;
    }

    function copyResult() {
        const el = document.getElementById('resultContent');
        if (el) {
            navigator.clipboard.writeText(el.innerText).then(() => {
                const btn = document.querySelector('.result-header .btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check me-1"></i>복사됨';
                setTimeout(() => btn.innerHTML = orig, 1500);
            });
        }
    }

    function addHistory(moduleName, target, success) {
        const card = document.querySelector(`.module-card[data-module="${moduleName}"]`);
        const label = card ? card.querySelector('h6').textContent : moduleName;
        const now = new Date().toLocaleTimeString('ko-KR');

        history.unshift({label, target, success, time: now});
        if (history.length > 50) history.pop();

        renderHistory();
    }

    function renderHistory() {
        const box = document.getElementById('historyBox');
        const list = document.getElementById('historyList');
        box.style.display = 'block';

        list.innerHTML = history.map(h => `
            <div class="history-item">
                <div>
                    <span class="module-tag">${h.label}</span>
                    <span class="target ms-2">${h.target}</span>
                </div>
                <div>
                    <i class="bi ${h.success ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'} me-2"></i>
                    <span class="time">${h.time}</span>
                </div>
            </div>
        `).join('');
    }

    function clearHistory() {
        history.length = 0;
        scanCount = 0;
        document.getElementById('totalScans').textContent = '0';
        document.getElementById('historyBox').style.display = 'none';
    }
</script>

</body>
</html>
